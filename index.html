<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#f0f3f6;--muted:#b4bcc6;--line:#2a313a;--emerging:#1e3a5f;--rising:#1a4d2e;--peaking:#5c4a1f;--fading:#3d3d3d;--dead:#2a2222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans","Segoe UI",sans-serif}
header{padding:14px 32px 4px}header h1{margin:0 0 4px;font-size:18px;font-weight:650}
.lede{max-width:none;color:var(--ink);font-size:12px;line-height:1.35;margin:0 0 4px}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 0}
#reload{background:#1a4d2e;border:1px solid #1a4d2e;color:#fff;padding:5px 12px;border-radius:999px;font:12px/1.2 inherit;cursor:pointer}
.error{display:none;margin:12px 32px 0;padding:12px 14px;background:#2a2222;border:1px solid #8a3a3a;border-radius:10px;color:#d08a8a;font-size:13px}
.error.on{display:block}.tabs{display:flex;gap:8px;padding:16px 32px 0}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font:13px/1.2 inherit;cursor:pointer}
.tabs button.on{background:#1a4d2e;border-color:#1a4d2e;color:#fff}
.pane{display:none}.pane.on{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 32px 0;color:var(--muted);font-size:13px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pipe{display:grid;gap:12px;padding:18px 32px 8px;align-items:start}
.pipe.funnel{grid-template-columns:1.25fr 1.1fr .8fr 1fr}
.pipe.candidates{grid-template-columns:.9fr 1.05fr 1fr .85fr .75fr}
.col{background:var(--panel);border-radius:10px;padding:10px}
.col h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:8px 10px;border-radius:6px}
.col .sub{margin:0 2px 10px;font-size:11px;line-height:1.35;color:var(--muted)}
.col.board h2{background:var(--emerging)}.col.theses h2{background:var(--rising)}.col.now h2{background:var(--peaking)}
.col.thesis-cands h2,.col.stocks h2{background:#1a3d4d}.col.screen h2{background:var(--peaking)}
.col.monitor h2{background:var(--fading)}.col.action h2{background:var(--rising)}.col.book h2{background:var(--dead)}
.card{background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:8px}
.card:last-child{margin-bottom:0}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px solid #5c4a1f;color:#c9b27a;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;vertical-align:6px}
.tag.kind{border-color:#3d5a80;color:#9bb4d0}.tag.live{border-color:#1a4d2e;color:#8fbf9f}
.tag.unfinished{border-color:#5c4a1f;color:#c9b27a}.tag.expr,.tag.stock{border-color:#3d5a80;color:#9bb4d0}
.tag.wait{border-color:#3d3d3d;color:#b4bcc6}.tag.fail{border-color:#8a3a3a;color:#d08a8a}
.card .nid{font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin-bottom:4px}
.card .title{font-weight:650;font-size:16px}.card .story,.card .claim{margin-top:6px;font-size:14px}
.card .from{margin-top:6px;font-size:12px;color:#8b94a0}
.card .field{margin-top:6px;font-size:12px;color:#8b94a0}.card .field b{color:#c9b27a;font-weight:650}
.card .desk{margin-top:8px;font-size:12px;color:#c9b27a}.card .desk.fail{color:#d08a8a}
.empty{color:var(--muted);font-size:13px;padding:8px}
.deadstrip{margin:10px 32px 8px;background:var(--panel);border-radius:10px;padding:10px}
.deadstrip h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:8px 10px;border-radius:6px;background:var(--dead)}
.deadstrip .sub,.deadstrip .foot{margin:0 2px 8px;font-size:11px;line-height:1.35;color:var(--muted)}
.judge{display:none;margin:8px 32px 28px;padding:12px 14px;background:var(--panel);border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.judge.on{display:block}.judge b{color:#c9b27a;font-weight:650}

(function(){
var SHA_URL="https://api.github.com/repos/nathanjenk467-design/investment-funnel/commits/main";
var EMBEDDED={"rev":6,"title":"Investment funnel","lede":"Funnel is world pictures and thesis candidates (expressions). Candidates tab is names (spawned or thrown), then Screen after analysis, then monitor / action / book. Reload for the latest walk.","meta":"15 Aug 2026. Micro pass. Named VST and JL MAG. Four waits. MP dies. Book empty.","judge":"Micro desk, 15 Aug 2026. Themes left as Macro wrote them. No new thesis. Physical side of TH-01 still confirmed (HBM/DRAM booked through 2027; MU FQ3 DRAM prices +low-60s% QoQ; Texas large-load queue ~474 GW with an Abbott audit pause 3 Aug). Plant equities spent. Power is the less-spent tape and still not a buy. TH-02 now has a written magnet vehicle. Trailing-edge socket stays unnamed (too hard). TH-03 still failed skew. Four waitlists, all needing both conditions. Action empty. Book empty. TSM, MU, and VST are one TH-01 factor, not three bets. MP dies as the kill side of TH-02.","tabs":[{"id":"funnel","name":"Funnel","default":true,"legend":[{"color":"#1e3a5f","label":"Board"},{"color":"#1a4d2e","label":"Theses 6–12 months"},{"color":"#5c4a1f","label":"Theses now"},{"color":"#1a3d4d","label":"Thesis candidates"},{"color":"#2a2222","label":"Dead / parked"}],"legend_note":"labels: board card · live · expression","layout":"funnel","columns":[{"id":"board","name":"Board","class":"board","subtitle":"cooked Trend-board cards + P1–P3 + OB-01/02/03. Not narratives.","cards":[{"id":"15","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"AI chip factories are still dramatically under-built","story":"The plants that make the chips were not built fast enough for the demand now hitting them. That shortage, not a China-invasion story, is still the brake. New tapes this week did not kill it. They keep running into the same wall.","from":"From: the TSMC story already kept. Fed this week by All-In, Dylan Patel, Stratechery."},{"id":"7","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"In July the market panicked. The factories did not.","story":"AI stock prices had a crash month that felt like 2022. Gavin Baker went looking for a real-world reason and could not find one. Chips were getting easier to get, rental prices were up, memory was up, and people were using more tokens, not less. The scare was in the price of the shares. It was not in the plants.","from":"From: Gavin Baker, Invest Like the Best, 4 Aug. MSM: FT Alphaville, BBC, and the FSB ran the July “AI bubble” scare."},{"id":"16","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"Compute is getting dearer, and old cards still earn","story":"Useful intelligence is getting more expensive, not cheaper. An H100 is worth more today than three years ago. When a model got ten times cheaper, people used it thirteen times more. A six-year write-off looks wrong because the cards stay in the money long after the accountant is done with them.","from":"From: the compute-dearer story already kept. Enforced this week by Atallah, Dylan Patel, Stratechery."},{"id":"1","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"The money is going to the plants, not the next model","story":"Google is putting cash into data-center plants, not into the next model. Inside the company the cloud team wants to rent those chips out, and the model team wants the same chips to train. The chips are winning.","from":"From: All-In 8 Aug (Friedberg, Gerstner). Stratechery: Google the capital company."},{"id":"6","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"Ordinary funding may be exhausted. That is why they are lending to themselves.","story":"The plants and the labs need more cash than earnings, banks, and ordinary borrowing can cover. That claim still needs proof. If it is true, they have to invent other money: chip sellers lending to their own buyers, Nvidia reaching into insurance and pension money, the same dollars going around the same few companies and getting counted as revenue. Circular funding and the debt pile are what you do when the normal tap is dry. The BIS has already said the biggest cloud companies are spending faster than they earn. That is a start, not a close.","from":"From: the board frame. All-In (Gurley circular). Stratechery 11 Aug Nvidia’s risky business. Gavin Baker on credit wrappers. BIS on hyperscaler spend vs cash."},{"id":"11","kind":"board_card","tags":[{"label":"board card","class":"kind"},{"label":"fight","class":"fail"}],"title":"Power is the problem. Nobody agrees what happens next.","story":"Everyone serious now says intelligence will hit a wall made of electricity. That part is shared. The fight is about the future. One camp says China will add far more power than America next year, so energy stays the limit. Another camp says you can build power, and the real 2030 bind is the rarest machines that make the chips. A third camp says put the plants in space, because on the ground you cannot get a permit. These cannot all be right about what happens next.","from":"From: Vishria 11 Aug. Dylan Patel 13 Mar. Dwarkesh Elon 5 Feb. Stratechery SpaceX IPO."},{"id":"10","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"China is locking the ugly supply chains","story":"China stopped exporting research monkeys. Prices jumped, US labs ran short. It already refines most rare earths and is moving to own the robots that run the mines, not just the rocks. In the Iran oil shock it quietly cut imports from stockpiles the West cannot see. The FCC just swept robot vacuums and humanoids onto a national-security import list. Each of these is an input the West did not build a second source for.","from":"From: ChinaTalk 14 Jul–13 Aug (monkeys, minerals, oil, FCC robots)."},{"id":"18","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"The payment system has not caught up to the model","story":"Intelligence is getting expensive. The rails that pay for it are still yesterday’s rails. Stripe talks about software agents that need to pay for things. A payments founder says the banker in your pocket is coming and is not here. This is not a crypto-price story. It is that the model and the payment have not joined up.","from":"From: Founders 2 Aug Micky Malka. Stripe / Collison."},{"id":"P1","kind":"prediction","tags":[{"label":"prediction","class":"kind"}],"title":"The chip factories will still be the bottleneck at Christmas, even if the stocks crash again","story":"The plants that make AI chips were not built fast enough. That is why computers for intelligence are expensive, and why a three-year-old chip still earns money. In July the newspapers and the stock market had a panic. A fund manager went looking for a factory reason and could not find one. The scare was in the share price. It was not in the factories.","fields":[{"label":"Call","text":"By 31 December 2026 that is still true. The wait for a new chip, and the price to rent one, will still be tight or tighter."},{"label":"Wrong if","text":"the wait gets easy and rents collapse, while everyone is still talking about AI."}]},{"id":"P2","kind":"prediction","tags":[{"label":"prediction","class":"kind"}],"title":"If ordinary money is exhausted, one of these alternative deals will break in public within a year","story":"If the usual funding is exhausted, companies are no longer just paying cash. Chip sellers are lending to their own buyers. Nvidia is reaching into insurance money and pension money. The same dollars go around the same few companies and get counted as revenue. That can look like a boom on paper while the cash never came from a real customer.","fields":[{"label":"Call","text":"Before 14 August 2027, one of these loans or insurance deals will blow up, get rewritten, or show up in a newspaper with a real company name on it. A podcast complaining about circular money is not enough."},{"label":"Wrong if","text":"a year from now the plants are still being paid with ordinary cash, and the strange paper is gone."}]},{"id":"P3","kind":"prediction","tags":[{"label":"prediction","class":"kind"}],"title":"OpenAI and Anthropic will still take the money. Cheap models will take the usage.","story":"There are two markets now, and they are not the same. The two best labs can still charge for the model itself. Everyone a year behind can only charge for computers and consulting. Cheap and Chinese open models already do most of the everyday work. Money and usage have split.","fields":[{"label":"Call","text":"A year from now that split is still there. The expensive labs still collect most of the dollars. The cheap models still do most of the work."},{"label":"Wrong if","text":"a cheap model starts collecting the dollars too, or the expensive labs lose the dollar pile."}]},{"id":"OB-01","kind":"observation","tags":[{"label":"observation","class":"kind"}],"title":"China catching up in trailing-edge robotics semiconductors","story":"More than 300 Chinese auto and industrial chip suppliers are on the trailing-edge nodes that robots actually use. NXP and Infineon share is fading in those sockets. This is not a leading-edge TSMC story.","from":"From: kept observation. SemiAnalysis, 11 Mar 2025."},{"id":"OB-02","kind":"observation","tags":[{"label":"observation","class":"kind"}],"title":"Unitree G1 at $16K against a ~$100K Western humanoid","story":"Unitree is selling a G1 near $16,000. Western humanoids are still talked about near $100,000. UBTech is targeting about 1,000 units. Price and shipment talk, not a proven Western displacement.","from":"From: kept observation. SemiAnalysis."},{"id":"OB-03","kind":"observation","tags":[{"label":"observation","class":"kind"}],"title":"China holds about 90% of permanent magnets","story":"China still refines and makes most of the permanent magnets a motor needs. A Made-in-USA label after substantial transformation does not create a second magnet mine.","from":"From: kept observation. SemiAnalysis."}]},{"id":"theses","name":"Theses 6–12 months","class":"theses","subtitle":"forward pictures minted from the board. Not already moving the world.","cards":[{"id":"TH-01","kind":"thesis","tags":[{"label":"live","class":"live"}],"title":"The plants are still the scarce thing, and July’s scare was in the shares","claim":"The factories that make the chips were not built fast enough for the demand now hitting them. That shortage is still the brake. In July the shares panicked and the factories did not: chips were getting easier to get, rental and memory prices were up, and token use was up. Capital is already moving toward the plants, not the next model. The 6–12 month picture is that the physical thing stays scarce, and that July was a price event, not a factory event.","from":"From board: 15, 7, 16, 1","fields":[{"label":"Clock","text":"6–12 months. Call window overlaps P1 (bottleneck still true at Christmas)."},{"label":"Kill","text":"utilization down, rental and memory prices down, large capex cancelled. A second share-price scare without those prints is not a kill."},{"label":"Priced","text":"Checked 14 Aug 2026 Yahoo last prints. Default plant names already assume a lot of the good case: TSM $426.35 is −10.7% from the 30 Jun high and +13.8% off the 29 Jul scare close; MU $971.66 is +240% YTD and +31.5% off the 29 Jul close $739. Power tape did not run with them in 2026 (VST −8.2% YTD, −32% from the Sep 2025 high). Physical still tight. Not a buy on the spent names."}],"desk":"Desk: not on desk as a buy — plant tape spent; power is the less-spent vehicle and still a wait","desk_fail":true},{"id":"TH-02","kind":"thesis","tags":[{"label":"live","class":"live"}],"title":"China already owns the ugly inputs Western robots need","claim":"China stopped the monkeys, holds the rare earths and about 90% of the permanent magnets, is filling the trailing-edge MCU sockets robots actually use, and is already shipping a cheap humanoid unit. The West did not build a second source for the unglamorous inputs. That is one situation: the input is already theirs. It is not a claim that a US-listed humanoid works, or that a Western robot company is the way to hold it.","from":"From board: 10, OB-01, OB-02, OB-03","fields":[{"label":"Clock","text":"6–12 months"},{"label":"Kill","text":"magnet export relief plus a real Western second source, or Chinese humanoid shipments fail in public numbers."},{"label":"Priced","text":"Checked 14 Aug 2026. Chinese magnet landlords did not run this year (JL MAG 6680.HK HK$17.16, −7% YTD, −40% from the Oct 2025 high). The Western second-source names (MP, Lynas) are the kill side, not the hold."}],"desk":"Desk: not on desk as a buy — expression now written (CA-02); magnet name is a wait, trailing-edge socket still unnamed","desk_fail":true},{"id":"TH-03","kind":"thesis","tags":[{"label":"live","class":"live"},{"label":"failed skew","class":"fail"}],"title":"The model can spend. The payment rail cannot.","claim":"Intelligence is getting expensive. The rails that pay for it are still yesterday’s rails. Stripe talks about agents that need to pay. Malka’s point is that the banker in your pocket is coming and is not here. The model and the payment have not joined up. That is the situation. It is not a crypto-price story, and it is not a claim that a new payments winner already exists.","from":"From board: 18","fields":[{"label":"Clock","text":"6–12 months"},{"label":"Kill","text":"agents stay demos; existing rails (Visa, Stripe, banks) absorb the traffic without a new winner."},{"label":"Priced","text":"“AI payments” is an easy story and is probably in several names already. Not checked live."}],"desk":"Desk: failed skew gate — not enough asymmetry on the obvious names","desk_fail":true}]},{"id":"now","name":"Theses now","class":"now","subtitle":"dominating / rising / peaking in the world right now. Not a 6–12 month bet.","empty":"None. A now-thesis is already moving the world; it is not a forward picture.","cards":[]},{"id":"thesis-cands","name":"Thesis candidates","class":"thesis-cands","subtitle":"expressions of a live thesis. Not a name. Not a buy. Spawns stock rows.","cards":[{"id":"CA-01","kind":"thesis_candidate","unfinished":false,"buy":false,"tags":[{"label":"expression","class":"expr"}],"title":"Plant-and-power landlords","story":"An expression of TH-01, not a stock, not a buy. Sit with whoever owns the scarce physical thing — the foundry, the memory plants, the power landlords. This pass named the vehicles and screened them. None of them are a buy.","from":"From: TH-01","fields":[{"label":"What it is","text":"A thesis candidate. The shape of how TH-01 would be held."},{"label":"What it is not","text":"A stock. A buy. A ticker. The next model. A spender. A tool-maker or a test-side consumable."},{"label":"World","text":"confirmed on the physical; spent on the default plant names; fade/wait on power · fundamental-first"},{"label":"Tape","text":"14 Aug 2026 Yahoo lasts. Physical agreeing: DigiTimes (mid-Aug) says 2027 DRAM/HBM from the three memory plants is booked; Micron 12 Aug said 2027 tighter than 2026 and DRAM is the constraint, not power. Plant tape spent: TSM $426.35 is +40% YTD and already bought back the July scare; MU $971.66 is +240% YTD and +31.5% off 29 Jul $739. Power tape did not run with them: VST $148.13 is −8.2% YTD and −32% from 22 Sep 2025 $217.92. Texas pause (Abbott 3 Aug, ERCOT Batch Zero delayed, PUCT 20 Aug) is a queue audit, not a print that the landlord already gets paid. Sit."},{"label":"How the hold fails","text":"Even if TH-01 is true, the plant can stay scarce and the landlord still not get paid (customer keeps the surplus; memory contracts already locked the rent; the Texas queue is mostly phantom — Vistra’s own CEO said 8 Aug he wants the queue culled). Power load that is real is a 2027–28 hookup. That is late for a 6–12 month clock."},{"label":"Spawns","text":"ST-01, ST-02, ST-08"}],"desk":"Sit. Hang is real. Plant names spent. Power is a wait, not an action.","desk_fail":true},{"id":"CA-02","kind":"thesis_candidate","unfinished":true,"buy":false,"tags":[{"label":"expression","class":"expr"},{"label":"unfinished","class":"unfinished"}],"title":"Ugly-input landlords","story":"Expression of TH-02. Sit with whoever already owns the magnet. Not a US-listed humanoid. Not a Western rare-earth second source — that is the kill, so MP and Lynas die if thrown as longs.","from":"From: TH-02","fields":[{"label":"What it is","text":"Input / squeeze side of TH-02. Magnet vehicle is now named (ST-03). Trailing-edge socket is still unnamed."},{"label":"What it is not","text":"A US humanoid. A Western mine or magnet second source. A fabless MCU with a robot slide."},{"label":"World","text":"early · fundamental-first"},{"label":"Tape","text":"14 Aug 2026. China still makes most of the permanent magnets a motor needs. JL MAG 6680.HK HK$17.16, −7% YTD, −40% from 13 Oct 2025. The tape of the landlord is not running. MP $58.74 bounced +42% off its 29 Jul low — that is the kill-side name catching a bid, not our hold."},{"label":"How the hold fails","text":"Even if China still owns the magnet, the listed landlord can be an EV-cycle stock (JL MAG’s FY2025 magnet revenue was mostly NEV, robot rotors still small-batch). Export licences can sit with the state, not the shareholder. A Made-in-USA label after substantial transformation is not a second mine, but a real Western magnet plant would be the kill."},{"label":"Spawns","text":"ST-03, ST-04"}],"desk":"Magnet vehicle written. Socket unnamed. Sit. Not a buy.","desk_fail":true}]}],"strips":[{"id":"dead","name":"Dead / parked","class":"deadstrip","subtitle":"killed or parked pictures. Held / off-desk is not dead.","empty":"None this walk.","cards":[]}]},{"id":"candidates","name":"Candidates","default":false,"legend":[{"color":"#1a3d4d","label":"Stocks"},{"color":"#5c4a1f","label":"Screen"},{"color":"#3d3d3d","label":"Monitor"},{"color":"#1a4d2e","label":"Action"},{"color":"#2a2222","label":"Book"}],"legend_note":"labels: unfinished · waitlist · dies","layout":"candidates","columns":[{"id":"stocks","name":"Stocks","class":"stocks","subtitle":"spawned from a thesis candidate, or a name you threw. Not analyzed yet. Not a buy.","cards":[{"id":"ST-04","kind":"stock","unfinished":true,"buy":false,"tags":[{"label":"stock","class":"stock"},{"label":"unfinished","class":"unfinished"}],"title":"Trailing-edge robot MCU sockets (names not picked)","story":"Generic slot under CA-02. No ticker this pass. GigaDevice 3986.HK is fabless plus a humanoid product story (14 Aug HK$511, −58.8% from 29 Jun HK$1,241, +129% from the 13 Jan listing print) — not a verified socket we can stand behind. Hua Hong 1347.HK / SMIC 0981.HK are China trailing-edge plants and a geopolitics factor this desk does not understand well enough. NXP / Infineon are the side that is supposed to be losing the socket. Too hard. Unnamed is cleaner than a fake screen.","from":"From: CA-02","desk":"Not a buy. Lifecycle: unfinished stock.","desk_fail":true}]},{"id":"screen","name":"Screen","class":"screen","subtitle":"after a pick is analyzed.","cards":[{"id":"ST-01","kind":"screen","tags":[{"label":"screen","class":"kind"},{"label":"monitor","class":"wait"}],"title":"Taiwan Semiconductor (TSM) — hang is real, skew is not","story":"Thinking 6/10. Hang: TH-01 / CA-01. They own the leading-edge plants. Customer cannot leave that node for a long time. This is a franchise, and the asking price already assumes a lot of the good case.","from":"From: CA-01","fields":[{"label":"Priced","text":"14 Aug 2026 Yahoo last $426.35. +40.3% YTD from 31 Dec 2025 $303.89. 30 Jun $477.57 (the 52-week high in this window). 29 Jul scare close $374.67. Now +13.8% off that close and only −10.7% from the high. July was a wiggle, already bought back."},{"label":"Downside","text":"Retest of 29 Jul $374.67 is about 12% from $426. A real TH-01 kill is larger than that. Do not write 10x down."},{"label":"Upside","text": function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function hkTime(iso){var d=iso?new Date(iso):new Date();if(isNaN(d.getTime()))d=new Date();return d.toLocaleString("en-GB",{timeZone:"Asia/Hong_Kong",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})+" HKT"}
function renderCard(card){var tags=(card.tags||[]).map(function(t){return '<span class="tag '+esc(t.class||"")+'">'+esc(t.label)+"</span>"}).join(" ");var html='<article class="card">';html+='<div class="nid">'+esc(card.id)+(tags?" "+tags:"")+"</div>";if(card.title)html+='<div class="title">'+esc(card.title)+"</div>";if(card.story)html+='<div class="story">'+esc(card.story)+"</div>";if(card.claim)html+='<div class="claim">'+esc(card.claim)+"</div>";if(card.from)html+='<div class="from">'+esc(card.from)+"</div>";(card.fields||[]).forEach(function(f){html+='<div class="field"><b>'+esc(f.label)+"</b>";if(f.text)html+=" "+esc(f.text);html+="</div>"});if(card.desk)html+='<div class="desk'+(card.desk_fail?" fail":"")+'">'+esc(card.desk)+"</div>";html+="</article>";return html}

function renderBoard(data){document.title=data.title||"Investment funnel";document.getElementById("lede").textContent=data.lede||"";document.getElementById("meta").textContent=data.meta||"";var tabs=data.tabs||[];renderTabs(tabs);tabs.forEach(function(tab){var pane=document.getElementById("pane-"+tab.id);if(!pane)return;var html='<section class="pipe '+esc(tab.layout||tab.id)+'">';(tab.columns||[]).forEach(function(col){html+=renderColumn(col)});html+="</section>";(tab.strips||[]).forEach(function(s){html+=renderStrip(s)});pane.innerHTML=html;renderLegend(document.getElementById(tab.id+"-legend"),tab)});var judge=document.getElementById("judge");if(data.judge){judge.innerHTML="<b>Ops judge.</b> "+esc(data.judge);judge.classList.add("on")}else{judge.innerHTML="";judge.classList.remove("on")}showPane(currentPane)}
function fetchSha(){return fetch(SHA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(c){return{sha:(c.sha||"").slice(0,7),when:(c.commit&&((c.commit.committer&&c.commit.committer.date)||(c.commit.author&&c.commit.author.date)))||null}}).catch(function(){return null})}
function setRevLine(shaInfo,data){var bits=[];if(data&&data.rev!=null)bits.push("rev "+data.rev);if(shaInfo&&shaInfo.sha){bits.push("main "+shaInfo.sha);bits.push(hkTime(shaInfo.when))}else{bits.push("main SHA unavailable");bits.push(hkTime(null))}document.getElementById("revline").textContent=bits.join(" \u00b7 ")}
