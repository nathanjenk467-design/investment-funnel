<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#f0f3f6;--muted:#b4bcc6;--line:#2a313a;--emerging:#1e3a5f;--rising:#1a4d2e;--peaking:#5c4a1f;--fading:#3d3d3d;--dead:#2a2222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans","Segoe UI",sans-serif}
header{padding:14px 32px 4px}header h1{margin:0 0 4px;font-size:18px;font-weight:650}
.lede{max-width:none;color:var(--ink);font-size:12px;line-height:1.35;margin:0 0 4px}
.meta{color:var(--muted);font-size:11px;margin:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 0}
#reload{background:#1a4d2e;border:1px solid #1a4d2e;color:#fff;padding:5px 12px;border-radius:999px;font:12px/1.2 inherit;cursor:pointer}
.error{display:none;margin:12px 32px 0;padding:12px 14px;background:#2a2222;border:1px solid #8a3a3a;border-radius:10px;color:#d08a8a;font-size:13px}
.error.on{display:block}.tabs{display:flex;gap:8px;padding:16px 32px 0}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font:13px/1.2 inherit;cursor:pointer}
.tabs button.on{background:#1a4d2e;border-color:#1a4d2e;color:#fff}
.pane{display:none}.pane.on{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 32px 0;color:var(--muted);font-size:13px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pipe{display:grid;gap:12px;padding:18px 32px 8px;align-items:start}
.pipe.funnel{grid-template-columns:1.25fr 1.1fr .8fr 1fr}
.pipe.candidates{grid-template-columns:.9fr 1.05fr 1fr .85fr .75fr}
.col{background:var(--panel);border-radius:10px;padding:10px}
.col h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:8px 10px;border-radius:6px}
.col .sub{margin:0 2px 10px;font-size:11px;line-height:1.35;color:var(--muted)}
.col.board h2{background:var(--emerging)}.col.theses h2{background:var(--rising)}.col.now h2{background:var(--peaking)}
.col.thesis-cands h2,.col.stocks h2{background:#1a3d4d}.col.screen h2{background:var(--peaking)}
.col.monitor h2{background:var(--fading)}.col.action h2{background:var(--rising)}.col.book h2{background:var(--dead)}
.card{background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:8px}
.card:last-child{margin-bottom:0}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px solid #5c4a1f;color:#c9b27a;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;vertical-align:6px}
.tag.kind{border-color:#3d5a80;color:#9bb4d0}.tag.live{border-color:#1a4d2e;color:#8fbf9f}
.tag.unfinished{border-color:#5c4a1f;color:#c9b27a}.tag.expr,.tag.stock{border-color:#3d5a80;color:#9bb4d0}
.tag.wait{border-color:#3d3d3d;color:#b4bcc6}.tag.fail{border-color:#8a3a3a;color:#d08a8a}
.card .nid{font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin-bottom:4px}
.card .title{font-weight:650;font-size:16px}.card .story,.card .claim{margin-top:6px;font-size:14px}
.card .from{margin-top:6px;font-size:12px;color:#8b94a0}
.card .field{margin-top:6px;font-size:12px;color:#8b94a0}.card .field b{color:#c9b27a;font-weight:650}
.card .desk{margin-top:8px;font-size:12px;color:#c9b27a}.card .desk.fail{color:#d08a8a}
.empty{color:var(--muted);font-size:13px;padding:8px}
.deadstrip{margin:10px 32px 8px;background:var(--panel);border-radius:10px;padding:10px}
.deadstrip h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:8px 10px;border-radius:6px;background:var(--dead)}
.deadstrip .sub,.deadstrip .foot{margin:0 2px 8px;font-size:11px;line-height:1.35;color:var(--muted)}
.judge{display:none;margin:8px 32px 28px;padding:12px 14px;background:var(--panel);border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.judge.on{display:block}.judge b{color:#c9b27a;font-weight:650}
</style>
</head>

var EMBEDDED={"rev":5,"title":"Investment funnel","lede":"Funnel is world pictures and thesis candidates (expressions). Candidates tab is names (spawned or thrown), then Screen after analysis, then monitor / action / book. Reload for the latest walk.","meta":"14 Aug 2026. CA-01 hold written, sit.","judge":"CA-01 is a written unfinished hold of TH-01. Sit. Not a buy. ST-01 / ST-02 not opened. No live price.","tabs":[{"id":"funnel","name":"Funnel","default":true,"legend":[{"color":"#1e3a5f","label":"Board"},{"color":"#1a4d2e","label":"Theses 6–12 months"},{"color":"#5c4a1f","label":"Theses now"},{"color":"#1a3d4d","label":"Thesis candidates"},{"color":"#2a2222","label":"Dead / parked"}],"legend_note":"labels: board card · live · expression","layout":"funnel","columns":[{"id":"board","name":"Board","class":"board","subtitle":"cooked Trend-board cards. Not narratives.","cards":[{"id":"15","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"AI chip factories are still dramatically under-built","story":"The plants that make the chips were not built fast enough for the demand now hitting them. That shortage, not a China-invasion story, is still the brake.","from":"From: the TSMC story already kept."},{"id":"7","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"In July the market panicked. The factories did not.","story":"AI stock prices had a crash month. The scare was in the price of the shares. It was not in the plants.","from":"From: Gavin Baker, 4 Aug."},{"id":"16","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"Compute is getting dearer, and old cards still earn","story":"Useful intelligence is getting more expensive, not cheaper.","from":"From: the compute-dearer story already kept."},{"id":"1","kind":"board_card","tags":[{"label":"board card","class":"kind"}],"title":"The money is going to the plants, not the next model","story":"Capital follows the scarce physical thing (plants, power, chips), not the research team.","from":"From: All-In 8 Aug. Stratechery."}]},{"id":"theses","name":"Theses 6–12 months","class":"theses","subtitle":"forward pictures minted from the board. Not already moving the world.","cards":[{"id":"TH-01","kind":"thesis","tags":[{"label":"live","class":"live"}],"title":"The plants are still the scarce thing, and July’s scare was in the shares","claim":"The factories that make the chips were not built fast enough for the demand now hitting them. That shortage is still the brake. In July the shares panicked and the factories did not. The 6–12 month picture is that the physical thing stays scarce, and that July was a price event, not a factory event.","from":"From board: cards 15, 7, 16, 1. Prediction P1 is evidence, not a second thesis.","fields":[{"label":"Clock","text":"6–12 months. Call window overlaps P1 (bottleneck still true at Christmas)."},{"label":"Kill","text":"utilization down, rental and memory prices down, large capex cancelled. A second share-price scare without those prints is not a kill."}],"desk":"Desk: not on desk — priced-in not checked; default expressions look crowded","desk_fail":true}]},{"id":"now","name":"Theses now","class":"now","subtitle":"dominating / rising / peaking in the world right now. Not a 6–12 month bet.","empty":"None. A now-thesis is already moving the world; it is not a forward picture.","cards":[]},{"id":"thesis-cands","name":"Thesis candidates","class":"thesis-cands","subtitle":"expressions of a live thesis. Not a name. Not a buy. Spawns stock rows.","cards":[{"id":"CA-01","kind":"thesis_candidate","unfinished":true,"buy":false,"tags":[{"label":"expression","class":"expr"},{"label":"unfinished","class":"unfinished"}],"title":"Plant-and-power landlords","story":"An expression of TH-01, not a stock, not a buy, not a ticker. The way to hold “the plants are still the scarce thing” is to sit with the people who own the scarce physical thing — the foundry, the power landlords. This card is that picture. It spawns ST-01, ST-02. Those names stay unfinished and unscreened.","from":"From: TH-01","fields":[{"label":"What it is","text":"A thesis candidate. A written hold of TH-01, before any name is screened."},{"label":"What it is not","text":"A stock. A buy. A ticker. A price."},{"label":"Must stay true","text":"The plants that make the leading chips, and the electricity that turns them on, stay scarce. Utilization stays high. Memory prices and GPU rents do not collapse. Big build programs at foundries / memory / power queue are not cancelled. A second scare in the shares, by itself, is not a kill."},{"label":"Tape","text":"The physical side is agreeing; the tape is not early. July was a share-price scare (semis dumped hard, plants did not). Some of that was bought back in early August. On the obvious plant side the story may already be partly spent. On power it is still early (Texas paused the data-center interconnect queue in August). Sit. A good picture with a tape that just bounced the scare is a wait, not a name."},{"label":"How the hold fails","text":"Even if TH-01 is true, the plant can stay scarce and the landlord still not get paid (customer keeps the surplus; memory contracts already locked the rent; queue is mostly phantom)."},{"label":"Spawns","text":"ST-01, ST-02. Unfinished. Unscreened."}],"desk":"Sit. Unfinished hold. No live price. ST-01 / ST-02 not opened.","desk_fail":true},{"id":"CA-02","kind":"thesis_candidate","unfinished":true,"buy":false,"tags":[{"label":"expression","class":"expr"},{"label":"unfinished","class":"unfinished"}],"title":"Ugly-input landlords","story":"Expression of TH-02. Sit with whoever already owns the magnet and the trailing-edge socket. Not a US-listed humanoid. Not a Western rare-earth second source (that is the kill).","from":"From: TH-02","fields":[{"label":"What it is","text":"Input / squeeze side of TH-02. Unfinished. No ticker we can stand behind."},{"label":"Spawns","text":"ST-03 magnet/RE unnamed. ST-04 trailing-edge MCU unnamed."}]}]}],"strips":[{"id":"dead","name":"Dead / parked","class":"deadstrip","subtitle":"killed or parked pictures. Held / off-desk is not dead.","empty":"None this walk.","cards":[]}]},{"id":"candidates","name":"Candidates","default":false,"legend":[{"color":"#1a3d4d","label":"Stocks"},{"color":"#5c4a1f","label":"Screen"},{"color":"#3d3d3d","label":"Monitor"},{"color":"#1a4d2e","label":"Action"},{"color":"#2a2222","label":"Book"}],"legend_note":"labels: unfinished · waitlist","layout":"candidates","columns":[{"id":"stocks","name":"Stocks","class":"stocks","subtitle":"spawned from a thesis candidate, or a name you threw. Not analyzed yet. Not a buy.","cards":[{"id":"ST-01","kind":"stock","unfinished":true,"buy":false,"tags":[{"label":"stock","class":"stock"},{"label":"unfinished","class":"unfinished"}],"title":"Taiwan Semiconductor (TSM)","story":"The default name people already use for the foundry side of TH-01. Unfinished. No live price. May be crowded. Not a buy.","from":"From: CA-01 / TH-01","desk":"Not a buy. Lifecycle: unfinished stock.","desk_fail":true},{"id":"ST-02","kind":"stock","unfinished":true,"buy":false,"tags":[{"label":"stock","class":"stock"},{"label":"unfinished","class":"unfinished"}],"title":"Power landlords (names not picked)","story":"The grid / power names people already use for the same TH-01 factor. Unfinished. Several names may be one bet. Not a buy. No ticker written.","from":"From: CA-01 / TH-01","desk":"Not a buy. Lifecycle: unfinished stock.","desk_fail":true}]},{"id":"screen","name":"Screen","class":"screen","subtitle":"after a pick is analyzed.","empty":"Named stocks move here once priced.","cards":[]},{"id":"monitor","name":"Monitor","class":"monitor","subtitle":"waitlist. Both conditions must print.","cards":[{"id":"WL-01","kind":"waitlist","tags":[{"label":"waitlist","class":"wait"}],"title":"Watches ST-01 / ST-02. Arms only on two conditions","story":"It does not arm because the picture is true. It arms only if both conditions print on the stock names.","from":"Watches: ST-01, ST-02. From: CA-01 / TH-01","desk":"Lifecycle: waitlist. Waiting is the action."}]},{"id":"action","name":"Action","class":"action","subtitle":"conditions already met. Should act.","empty":"None. Conditions have not hit.","cards":[]},{"id":"book","name":"Book","class":"book","subtitle":"decided to act.","empty":"Nothing on the book. No execution this walk.","cards":[]}]}]};
var lastBoard=null,currentPane=(location.hash==="#candidates")?"candidates":"funnel";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function hkTime(iso){var d=iso?new Date(iso):new Date();if(isNaN(d.getTime()))d=new Date();return d.toLocaleString("en-GB",{timeZone:"Asia/Hong_Kong",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})+" HKT"}
function renderCard(card){var tags=(card.tags||[]).map(function(t){return '<span class="tag '+esc(t.class||"")+'">'+esc(t.label)+"</span>"}).join(" ");var html='<article class="card">';html+='<div class="nid">'+esc(card.id)+(tags?" "+tags:"")+"</div>";if(card.title)html+='<div class="title">'+esc(card.title)+"</div>";if(card.story)html+='<div class="story">'+esc(card.story)+"</div>";if(card.claim)html+='<div class="claim">'+esc(card.claim)+"</div>";if(card.from)html+='<div class="from">'+esc(card.from)+"</div>";(card.fields||[]).forEach(function(f){html+='<div class="field"><b>'+esc(f.label)+"</b>";if(f.text)html+=" "+esc(f.text);html+="</div>"});if(card.desk)html+='<div class="desk'+(card.desk_fail?" fail":"")+'">'+esc(card.desk)+"</div>";html+="</article>";return html}
function renderColumn(col){var html='<div class="col '+esc(col.class||col.id)+'">';html+="<h2>"+esc(col.name)+"</h2>";if(col.subtitle)html+='<p class="sub">'+esc(col.subtitle)+"</p>";var cards=col.cards||[];if(!cards.length)html+='<p class="empty">'+esc(col.empty||"None.")+"</p>";else cards.forEach(function(c){html+=renderCard(c)});html+="</div>";return html}
function renderStrip(strip){var html='<section class="deadstrip">';html+="<h2>"+esc(strip.name)+"</h2>";if(strip.subtitle)html+='<p class="sub">'+esc(strip.subtitle)+"</p>";var cards=strip.cards||[];if(!cards.length)html+='<p class="empty">'+esc(strip.empty||"None.")+"</p>";else cards.forEach(function(c){html+=renderCard(c)});html+="</section>";return html}
function renderLegend(el,tab){if(!el)return;var html="";(tab.legend||[]).forEach(function(item){html+='<span><i class="swatch" style="background:'+esc(item.color)+'"></i>'+esc(item.label)+"</span>"});if(tab.legend_note)html+="<span>"+esc(tab.legend_note)+"</span>";el.innerHTML=html}
function showPane(id){currentPane=id;document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("on",p.id==="pane-"+id)});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-pane")===id)});var fl=document.getElementById("funnel-legend"),cl=document.getElementById("candidates-legend");if(fl)fl.style.display=id==="funnel"?"flex":"none";if(cl)cl.style.display=id==="candidates"?"flex":"none"}
function renderTabs(tabs){var host=document.getElementById("tabs");host.innerHTML="";tabs.forEach(function(tab){var b=document.createElement("button");b.setAttribute("data-pane",tab.id);b.textContent=tab.name;if(tab.id===currentPane)b.className="on";b.addEventListener("click",function(){showPane(tab.id)});host.appendChild(b)})}
function renderBoard(data){document.title=data.title||"Investment funnel";document.getElementById("lede").textContent=data.lede||"";document.getElementById("meta").textContent=data.meta||"";var tabs=data.tabs||[];renderTabs(tabs);tabs.forEach(function(tab){var pane=document.getElementById("pane-"+tab.id);if(!pane)return;var html='<section class="pipe '+esc(tab.layout||tab.id)+'">';(tab.columns||[]).forEach(function(col){html+=renderColumn(col)});html+="</section>";(tab.strips||[]).forEach(function(s){html+=renderStrip(s)});pane.innerHTML=html;renderLegend(document.getElementById(tab.id+"-legend"),tab)});var judge=document.getElementById("judge");if(data.judge){judge.innerHTML="<b>Ops judge.</b> "+esc(data.judge);judge.classList.add("on")}else{judge.innerHTML="";judge.classList.remove("on")}showPane(currentPane)}
function fetchSha(){return fetch(SHA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(c){return{sha:(c.sha||"").slice(0,7),when:(c.commit&&((c.commit.committer&&c.commit.committer.date)||(c.commit.author&&c.commit.author.date)))||null}}).catch(function(){return null})}
function setRevLine(shaInfo,data){var bits=[];if(data&&data.rev!=null)bits.push("rev "+data.rev);if(shaInfo&&shaInfo.sha){bits.push("main "+shaInfo.sha);bits.push(hkTime(shaInfo.when))}else{bits.push("main SHA unavailable");bits.push(hkTime(null))}document.getElementById("revline").textContent=bits.join(" \u00b7 ")}
function load(){var btn=document.getElementById("reload");btn.disabled=true;Promise.all([Promise.resolve(EMBEDDED),fetchSha()]).then(function(pair){lastBoard=pair[0];renderBoard(pair[0]);setRevLine(pair[1],pair[0])}).catch(function(err){document.getElementById("error").textContent=String(err&&err.message?err.message:err);document.getElementById("error").classList.add("on")}).then(function(){btn.disabled=false;btn.textContent="Reload"})}
document.getElementById("reload").addEventListener("click",function(){load()});load();
})();
