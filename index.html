<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment funnel</title>
<!-- funnel-shell rev=6 pin-3b8511f 2026-08-14T22:14HKT -->
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --ink: #f0f3f6;
    --muted: #b4bcc6;
    --line: #2a313a;
    --emerging: #1e3a5f;
    --rising: #1a4d2e;
    --peaking: #5c4a1f;
    --fading: #3d3d3d;
    --dead: #2a2222;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif; }
  header { padding: 14px 32px 4px; }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
  .lede { max-width: none; color: var(--ink); font-size: 12px; line-height: 1.35; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 11px; margin: 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 0; }
  #reload { background: #1a4d2e; border: 1px solid #1a4d2e; color: #fff; padding: 5px 12px; border-radius: 999px; font: 12px/1.2 inherit; cursor: pointer; }
  #reload:disabled { opacity: 0.55; cursor: wait; }
  .error { display: none; margin: 12px 32px 0; padding: 12px 14px; background: #2a2222; border: 1px solid #8a3a3a; border-radius: 10px; color: #d08a8a; font-size: 13px; }
  .error.on { display: block; }
  .tabs { display: flex; gap: 8px; padding: 16px 32px 0; }
  .tabs button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 6px 14px; border-radius: 999px; font: 13px/1.2 inherit; cursor: pointer; }
  .tabs button.on { background: #1a4d2e; border-color: #1a4d2e; color: #fff; }
  .pane { display: none; }
  .pane.on { display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 12px 32px 0; color: var(--muted); font-size: 13px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .pipe { display: grid; gap: 12px; padding: 18px 32px 8px; align-items: start; }
  .pipe.funnel { grid-template-columns: 1.25fr 1.1fr 0.8fr 1fr; }
  .pipe.candidates { grid-template-columns: 0.9fr 1.05fr 1fr 0.85fr 0.75fr; }
  .col { background: var(--panel); border-radius: 10px; padding: 10px; }
  .col h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; padding: 8px 10px; border-radius: 6px; }
  .col .sub { margin: 0 2px 10px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .col.board h2 { background: var(--emerging); }
  .col.theses h2 { background: var(--rising); }
  .col.now h2 { background: var(--peaking); }
  .col.thesis-cands h2, .col.stocks h2 { background: #1a3d4d; }
  .col.screen h2 { background: var(--peaking); }
  .col.monitor h2 { background: var(--fading); }
  .col.action h2 { background: var(--rising); }
  .col.book h2 { background: var(--dead); }
  .card { background: #0e1116; border: 1px solid var(--line); border-radius: 8px; padding: 12px 13px; margin-bottom: 8px; }
  .card:last-child { margin-bottom: 0; }
  .tag { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; border: 1px solid #5c4a1f; color: #c9b27a; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; vertical-align: 6px; }
  .tag.kind, .tag.expr, .tag.stock { border-color: #3d5a80; color: #9bb4d0; }
  .tag.obs, .tag.wait { border-color: #3d3d3d; color: #b4bcc6; }
  .tag.live { border-color: #1a4d2e; color: #8fbf9f; }
  .tag.held, .tag.unfinished, .tag.pred { border-color: #5c4a1f; color: #c9b27a; }
  .tag.fight, .tag.fail { border-color: #8a3a3a; color: #d08a8a; }
  .card .nid { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; margin-bottom: 4px; }
  .card .title { font-weight: 650; font-size: 16px; }
  .card .story { margin-top: 6px; font-size: 14px; color: var(--ink); }
  .card .force { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .card .from { margin-top: 6px; font-size: 12px; color: #8b94a0; }
  .card .heat { margin-top: 8px; font-size: 11px; color: #8b94a0; }
  .card .heat b { color: #c9b27a; font-weight: 650; }
  .card.fight { border-color: #8a3a3a; }
  .card .claim { margin-top: 6px; font-size: 14px; }
  .card .field { margin-top: 6px; font-size: 12px; color: #8b94a0; }
  .card .field b { color: #c9b27a; font-weight: 650; }
  .card .desk { margin-top: 8px; font-size: 12px; color: #c9b27a; }
  .card .desk.fail { color: #d08a8a; }
  .card .stats { margin-top: 8px; font-size: 12px; color: #c9b27a; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px; }
  .deadstrip { margin: 10px 32px 8px; background: var(--panel); border-radius: 10px; padding: 10px; }
  .deadstrip h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; padding: 8px 10px; border-radius: 6px; background: var(--dead); }
  .deadstrip .sub, .deadstrip .foot { margin: 0 2px 8px; font-size: 11px; color: var(--muted); }
  .judge { display: none; margin: 8px 32px 28px; padding: 12px 14px; background: var(--panel); border-radius: 10px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .judge.on { display: block; }
  .judge b { color: #c9b27a; font-weight: 650; }
</style>
</head>
<body>
<header>
  <h1>Investment funnel</h1>
  <p class="lede" id="lede">Loading board…</p>
  <p class="meta" id="meta"></p>
  <div class="toolbar">
    <button type="button" id="reload">Reload</button>
    <p class="meta" id="revline">pinned 3b8511f</p>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="legend" id="funnel-legend"></div>
<div class="legend" id="candidates-legend" style="display:none"></div>
<div class="error" id="error"></div>
<div class="pane on" id="pane-funnel"></div>
<div class="pane" id="pane-candidates"></div>
<div class="judge" id="judge"></div>
<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function renderHeat(heat) {
    if (!heat) return "";
    var parts = [];
    if (heat.text) parts.push(esc(heat.text));
    if (heat.fight) parts.push("fight");
    var html = parts.join(" · ");
    if (heat.score != null) html += (html ? " · " : "") + "<b>" + esc(heat.score) + "</b>";
    if (heat.note) html += " · " + esc(heat.note);
    return html ? '<div class="heat">' + html + "</div>" : "";
  }
  function renderCard(card) {
    var tags = (card.tags || []).map(function (t) {
      return '<span class="tag ' + esc(t.class || "") + '">' + esc(t.label) + "</span>";
    }).join(" ");
    var html = '<article class="card' + (card.fight ? " fight" : "") + '">';
    html += '<div class="nid">' + esc(card.id) + (tags ? " " + tags : "") + "</div>";
    if (card.title) html += '<div class="title">' + esc(card.title) + "</div>";
    if (card.story) html += '<div class="story">' + esc(card.story) + "</div>";
    if (card.claim) html += '<div class="claim">' + esc(card.claim) + "</div>";
    if (card.force) html += '<div class="force">' + esc(card.force) + "</div>";
    if (card.from) html += '<div class="from">' + esc(card.from) + "</div>";
    html += renderHeat(card.heat);
    (card.fields || []).forEach(function (f) {
      html += '<div class="field"><b>' + esc(f.label) + "</b>" + (f.text ? " " + esc(f.text) : "") + "</div>";
    });
    if (card.stats) html += '<div class="stats">' + esc(card.stats) + "</div>";
    if (card.desk) html += '<div class="desk' + (card.desk_fail ? " fail" : "") + '">' + esc(card.desk) + "</div>";
    return html + "</article>";
  }
  function renderColumn(col) {
    var html = '<div class="col ' + esc(col.class || col.id) + '"><h2>' + esc(col.name) + "</h2>";
    if (col.subtitle) html += '<p class="sub">' + esc(col.subtitle) + "</p>";
    var cards = col.cards || [];
    if (!cards.length) html += '<p class="empty">' + esc(col.empty || "None.") + "</p>";
    else cards.forEach(function (c) { html += renderCard(c); });
    return html + "</div>";
  }
  function renderStrip(strip) {
    var html = '<section class="' + esc(strip.class || "deadstrip") + '"><h2>' + esc(strip.name) + "</h2>";
    if (strip.subtitle) html += '<p class="sub">' + esc(strip.subtitle) + "</p>";
    var cards = strip.cards || [];
    if (!cards.length) html += '<p class="empty">' + esc(strip.empty || "None.") + "</p>";
    else cards.forEach(function (c) { html += renderCard(c); });
    if (strip.foot) html += '<p class="foot">' + esc(strip.foot) + "</p>";
    return html + "</section>";
  }
  var currentPane = (location.hash === "#candidates") ? "candidates" : "funnel";
  function showPane(id) {
    currentPane = id;
    document.querySelectorAll(".pane").forEach(function (p) { p.classList.toggle("on", p.id === "pane-" + id); });
    document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-pane") === id); });
    var fl = document.getElementById("funnel-legend");
    var cl = document.getElementById("candidates-legend");
    if (fl) fl.style.display = id === "funnel" ? "flex" : "none";
    if (cl) cl.style.display = id === "candidates" ? "flex" : "none";
  }
  function renderBoard(data) {
    document.title = data.title || "Investment funnel";
    document.getElementById("lede").textContent = data.lede || "";
    var meta = data.meta;
    if (meta && typeof meta === "object") meta = [meta.updated, meta.rev != null ? ("rev " + meta.rev) : ""].filter(Boolean).join(" · ");
    document.getElementById("meta").textContent = meta || "";
    var host = document.getElementById("tabs");
    host.innerHTML = "";
    (data.tabs || []).forEach(function (tab) {
      var b = document.createElement("button");
      b.setAttribute("data-pane", tab.id);
      b.textContent = tab.name;
      if (tab.id === currentPane) b.className = "on";
      b.addEventListener("click", function () { showPane(tab.id); });
      host.appendChild(b);
      var pane = document.getElementById("pane-" + tab.id);
      if (!pane) return;
      var html = '<section class="pipe ' + esc(tab.layout || tab.id) + '">';
      (tab.columns || []).forEach(function (col) { html += renderColumn(col); });
      html += "</section>";
      (tab.strips || []).forEach(function (s) { html += renderStrip(s); });
      pane.innerHTML = html;
      var el = document.getElementById(tab.id + "-legend");
      if (el) {
        var lhtml = "";
        (tab.legend || []).forEach(function (item) {
          lhtml += '<span><i class="swatch" style="background:' + esc(item.color) + '"></i>' + esc(item.label) + "</span>";
        });
        if (tab.legend_note) lhtml += "<span>" + esc(tab.legend_note) + "</span>";
        el.innerHTML = lhtml;
      }
    });
    var judge = document.getElementById("judge");
    if (data.judge) { judge.innerHTML = "<b>Ops judge.</b> " + esc(data.judge); judge.classList.add("on"); }
    else { judge.innerHTML = ""; judge.classList.remove("on"); }
    showPane(currentPane);
  }
  function fail(msg) {
    document.getElementById("error").textContent = msg;
    document.getElementById("error").classList.add("on");
    document.getElementById("lede").textContent = "Board failed to load.";
  }
  function load() {
    var urls = [
      "https://cdn.jsdelivr.net/gh/nathanjenk467-design/investment-funnel@3b8511f159cd64dfbd5867797e0f49a7c002de95/board.json",
      "https://raw.githack.com/nathanjenk467-design/investment-funnel/3b8511f159cd64dfbd5867797e0f49a7c002de95/board.json"
    ];
    function one(i) {
      return fetch(urls[i], { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        if (!data || !data.tabs) throw new Error("no tabs");
        renderBoard(data);
        document.getElementById("revline").textContent = "rev " + (data.rev || "?") + " · pinned 3b8511f";
      }).catch(function (err) {
        if (i + 1 < urls.length) return one(i + 1);
        fail("Could not load board. " + err.message);
      });
    }
    one(0);
  }
  document.getElementById("reload").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
